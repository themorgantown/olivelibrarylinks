name: Link Checker

on:
  schedule:
    - cron: "0 */12 * * *" # Run every 12 hours
  workflow_dispatch: # Allow manual triggering

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions: # Added permissions block
      issues: write # Grant permission to write issues
    defaults:
      run:
        working-directory: ./pupeteer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Specify Node.js version

      - name: Install dependencies
        run: npm ci

      - name: Run link checker script
        id: link_check
        run: |
          node count-links.js > link-checker-output.log 2>&1
          echo "SCRIPT_EXIT_CODE=$?" >> $GITHUB_ENV
          cat link-checker-output.log
          # Ensure LINK_COUNT is set even if grep fails, default to 0
          LINK_COUNT=$(grep \'FINAL_LINK_COUNT:\' link-checker-output.log | awk \'{print $2}\' || echo "0")
          echo "LINK_COUNT=$LINK_COUNT" >> $GITHUB_ENV
          echo "Link count determined: $LINK_COUNT"

      - name: Upload screenshot for issue
        if: env.LINK_COUNT < 1 || env.SCRIPT_EXIT_CODE != 0
        uses: actions/upload-artifact@v4
        with:
          name: link-checker-screenshot-for-issue # Unique name for this artifact
          path: pupeteer/latest-screenshot.png
          retention-days: 1 # Keep it short as it\'s for the issue

      - name: Create GitHub Issue if link count is less than 1 or script failed
        if: env.LINK_COUNT < 1 || env.SCRIPT_EXIT_CODE != 0
        uses: actions-ecosystem/action-create-issue@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          title: "ALERT: Olive Library Links - Link Count Low or Script Failed"
          body: |
            The link checker script reported an issue.
            - **Link Count:** ${{ env.LINK_COUNT }} (Threshold is < 1)
            - **Script Exit Code:** ${{ env.SCRIPT_EXIT_CODE }}
            - **Timestamp:** $(date)
            Please check the website and the Google Sheet.
            A screenshot of the page has been uploaded as an artifact with this run. Look for "link-checker-screenshot-for-issue".
            See the action run logs for more details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: bug, automated alert

      - name: Upload link checker logs and full run screenshot
        if: always() # Always upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: link-checker-artifacts # Keep this for general logs
          path: |
            pupeteer/link-checker-output.log
            pupeteer/latest-screenshot.png
            pupeteer/link-count-log.txt
          retention-days: 7
