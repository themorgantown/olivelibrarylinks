name: Link Checker

on:
  schedule:
    - cron: '0 */12 * * *'          # every 12 h
  workflow_dispatch:

concurrency:
  group: link‑checker‑${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    defaults:
      run:
        # valid template string → runner injects script at {0}
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Debug repo slug
        run: echo "::notice title=Debug Repo::${{ github.repository }}"

      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PAT_REPO }}   # PAT with repo scope
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install deps
        working-directory: ./puppeteer
        run: npm ci --no-audit --prefer-offline

      - name: Run link‑checker
        id: link_check
        working-directory: ./puppeteer
        run: |
          node count-links.js > link-checker-output.log 2>&1
          echo "SCRIPT_EXIT_CODE=$?" >> "$GITHUB_OUTPUT"
          LINK_COUNT=$(grep -oE 'FINAL_LINK_COUNT:[[:space:]]*[0-9]+' link-checker-output.log \
                       | awk '{print $2}')
          echo "LINK_COUNT=${LINK_COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Link‑count::${LINK_COUNT:-0}"

      - name: Upload screenshot for issue
        if: steps.link_check.outputs.LINK_COUNT == '0' || steps.link_check.outputs.SCRIPT_EXIT_CODE != '0'
        uses: actions/upload-artifact@v4
        with:
          name: failed‑link‑checker‑screenshot
          path: puppeteer/latest-screenshot.png
          retention-days: 1

      - name: Create alert issue
        if: steps.link_check.outputs.LINK_COUNT == '0' || steps.link_check.outputs.SCRIPT_EXIT_CODE != '0'
        uses: actions-ecosystem/action-create-issue@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          title: "⚠️ Olive Library Links: Link count low or script failed"
          labels: bug, automated-alert
          body: |
            **Link count:** ${{ steps.link_check.outputs.LINK_COUNT }}
            **Exit code:** ${{ steps.link_check.outputs.SCRIPT_EXIT_CODE }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Logs and screenshot are attached as workflow artifacts.

      - name: Upload logs & screenshot (always)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: link‑checker‑artifacts
          path: |
            puppeteer/link-checker-output.log
            puppeteer/latest-screenshot.png
          retention-days: 7